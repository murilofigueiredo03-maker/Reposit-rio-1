<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>figurino — passarela</title>
<style>@font-face{font-family:'Luckiest Guy';src:url(fontes/luckiest-guy.woff2)}html,body{margin:0;background:#111;overflow:hidden}#s{width:2160px;height:1500px;display:block}text{font-family:'Luckiest Guy',sans-serif}</style>
<script src="boneco.js"></script></head><body>
<svg id="s" viewBox="0 0 2160 1500" xmlns="http://www.w3.org/2000/svg"><defs><filter id="outline" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/><feFlood flood-color="#1D1D2B"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="2160" height="1500" fill="#F3E3C3"/><rect y="640" width="2160" height="10" fill="#B9A88A"/><rect y="1380" width="2160" height="10" fill="#B9A88A"/>
<text x="1080" y="60" font-size="54" fill="#111" text-anchor="middle">FIGURINOS · DE FRENTE E ANDANDO</text><g id="t"></g><g id="a"></g></svg>
<script>
const nomes = ['romano', 'romano-cidadao', 'senador', 'romana', 'legionario', 'vendedor', 'trabalhador', 'casual', 'moletom', 'marca'];
const A = document.querySelector('#a'), Tx = document.querySelector('#t');
const atores = [];
const rot = (x, y, t, c = '#111') => Tx.innerHTML += `<text x="${x}" y="${y}" font-size="30" fill="${c}" text-anchor="middle">${t}</text>`;
nomes.forEach((n, i) => { const x = 110 + i * 215; const b = new Boneco(A, { escala: 0.8, figurino: n, seed: i }); b.base(0, 9, 'parado', { x, y: 640 }); atores.push(b); rot(x, 690, n); });
rot(160 + 215, 690, '');
// protagonista em Roma (túnica preta + tênis laranja sempre) e outros andando de perfil
const anda = [['romano', '#111'], ['legionario', '#111'], ['romana', '#111'], [{ preset: 'romano', cor: '#2A2A30', cinto: '#FF7A00', protagonista: true }, '#C95A00'], ['marca', '#111']];
anda.forEach(([fg, c], i) => { const x0 = 120 + i * 420; const b = new Boneco(A, { escala: 0.8, figurino: fg, seed: 20 + i }); b.base(0, 9, 'andar', { de: [x0, 1380], ate: [x0 + 2000, 1380] }); atores.push(b); rot(x0 + 140, 1440, typeof fg === 'string' ? fg : 'PROTAGONISTA EM ROMA', c); });
window.__duration = 2;
window.__seek = t => atores.forEach(b => b.desenhar(0.25 + t * 0.12));
window.__seek(0);
</script></body></html>
