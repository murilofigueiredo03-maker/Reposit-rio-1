<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>teste gladiador</title>
<style>html,body{margin:0;background:#000;overflow:hidden}#stage{width:1920px;height:1080px;display:block}</style>
<script src="boneco.js"></script></head><body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs><filter id="outline" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/><feFlood flood-color="#1D1D2B"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1920" height="1080" fill="#E9C98E"/><rect y="900" width="1920" height="180" fill="#D9B46E"/>
<g id="a"></g></svg>
<script>
// Teste de figurinos de gladiador: protagonista (tanga preta, cinto laranja, tênis), secutor com capacete, reciário, lanista, imperador
const g = document.querySelector('#a');
const F = [{ preset: 'gladiador', cor: '#2A2A30', cinto: '#FF7A00', cabelo: 'nenhum', protagonista: true }, { preset: 'secutor', cor: '#2A2A30', cinto: '#FF7A00', protagonista: true }, 'reciario', 'lanista', 'imperador'];
const B = F.map((f, i) => { const b = new Boneco(g.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'g')), { escala: 0.9, seed: i + 3, figurino: f });
  b.base(0, 9, 'parado', { x: 260 + i * 350, y: 900, vista: i % 2 ? 'perfil' : 'frente', dir: 1 }); b.cabeca(1, 2, { virar: 0.6 }); b.cabeca(2.2, 3, { virar: -1 }); return b; });
window.__duration = 4; window.__seek = t => B.forEach(b => b.desenhar(t)); window.__seek(0);
</script></body></html>
