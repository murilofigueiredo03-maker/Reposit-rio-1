<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>movimento-humano — expressões</title>
<style>html,body{margin:0;background:#000;overflow:hidden}#stage{width:1920px;height:1080px;display:block}text{font-family:Inter,'DejaVu Sans',sans-serif;font-weight:800}</style>
<script src="boneco.js"></script>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
      <feFlood flood-color="#1D1D2B"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#F3E3C3"/>
  <g id="grade"></g>
</svg>
<script>
// Grade com todas as expressões (calado) — ?fala=1 mostra a boca falando
const fala = new URLSearchParams(location.search).get('fala');
const nomes = Boneco.expressoes;
const NS = 'http://www.w3.org/2000/svg', grade = document.querySelector('#grade');
const cols = 8, cw = 240, ch = 270;
const bonecos = nomes.map((nome, i) => {
  const cx = (i % cols) * cw + cw / 2, cy = Math.floor(i / cols) * ch;
  const cell = document.createElementNS(NS, 'g');
  const clip = document.createElementNS(NS, 'clipPath'); clip.id = 'c' + i;
  const r = document.createElementNS(NS, 'rect'); r.setAttribute('x', cx - cw / 2 + 6); r.setAttribute('y', cy + 6); r.setAttribute('width', cw - 12); r.setAttribute('height', ch - 12); r.setAttribute('rx', 18);
  clip.appendChild(r); grade.appendChild(clip);
  const bg = r.cloneNode(); bg.setAttribute('fill', '#8ED1F5'); grade.appendChild(bg);
  cell.setAttribute('clip-path', `url(#c${i})`); grade.appendChild(cell);
  const b = new Boneco(cell, { escala: 1.3, roupa: '#C8553D', seed: 100 + i, boca: fala ? (t => '3') : null });
  b.base(0, 10, 'parado', { x: cx, y: cy + 785 });
  b.expressao(0, 10, nome);
  const tx = document.createElementNS(NS, 'text'); tx.setAttribute('x', cx); tx.setAttribute('y', cy + ch - 18); tx.setAttribute('font-size', 26); tx.setAttribute('text-anchor', 'middle'); tx.setAttribute('fill', '#1D1D2B'); tx.textContent = nome;
  grade.appendChild(tx);
  return b;
});
window.__duration = 2;
window.__seek = t => bonecos.forEach(b => b.desenhar(0.4 + t));
window.__seek(0);
</script>
</body>
</html>
