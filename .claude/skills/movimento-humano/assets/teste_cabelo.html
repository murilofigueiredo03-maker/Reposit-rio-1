<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>teste cabelo</title>
<style>html,body{margin:0;background:#000;overflow:hidden}#stage{width:1920px;height:1080px;display:block}</style>
<script src="boneco.js"></script></head><body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs><filter id="outline" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/><feFlood flood-color="#1D1D2B"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1920" height="1080" fill="#8ED1F5"/><rect y="860" width="1920" height="220" fill="#6DBE5A"/>
<g id="a"></g></svg>
<script>
// Teste de cabelo virando: 3 estilos (curto, cacheado, coque) giram frente → perfil direita → frente → perfil esquerda
const g = document.querySelector('#a');
const B = ['legionario', 'vendedor', 'romana'].map((f, i) => {
  const b = new Boneco(g.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'g')), { escala: 1.1, seed: i + 3, figurino: Boneco.figurino(f) });
  b.base(0, 9, 'parado', { x: 480 + i * 480, y: 860, vista: 'frente', dir: 1 });
  b.cabeca(0.5, 1.5, { virar: 0.5 }); b.cabeca(1.5, 2.5, { virar: 1 }); b.cabeca(2.5, 3.5, { virar: 0 }); b.cabeca(3.5, 4.5, { virar: -1 });
  return b;
});
window.__duration = 5;
window.__seek = t => B.forEach(b => b.desenhar(t));
window.__seek(0);
</script></body></html>
