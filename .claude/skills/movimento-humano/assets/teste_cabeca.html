<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>teste cabeça</title>
<style>html,body{margin:0;background:#000;overflow:hidden}#stage{width:1920px;height:1080px;display:block}text{font-family:Inter,'DejaVu Sans',sans-serif;font-weight:800}</style>
<script src="boneco.js"></script></head><body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs><filter id="outline" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/><feFlood flood-color="#1D1D2B"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1920" height="1080" fill="#8ED1F5"/><rect y="860" width="1920" height="220" fill="#6DBE5A"/>
<text id="rot" x="960" y="90" font-size="56" fill="#1D1D2B" text-anchor="middle"></text>
<g id="a"></g></svg>
<script>
// Teste de cabeça: 0–1 deitado (rosto para cima), 1–2 levanta, 2–4 vira de perfil→frente→perfil, 4–5 inclina, 5–6 "sim", 6–7 "não", 7–8 olhar para cima
const b = new Boneco(document.querySelector('#a'), { escala: 1.2, roupa: '#C8553D', seed: 2 });
b.base(0, 1, 'deitado', { x: 1300, y: 830, dir: 1 }); b.expressao(0, 0.9, 'dormindo');
b.base(1, 9, 'parado', { x: 960, y: 860, vista: 'perfil', dir: 1, transicao: 0.8 });
b.cabeca(2.2, 3.0, { virar: 0 }); b.cabeca(3.0, 3.8, { virar: -1 });
b.cabeca(4.0, 5.0, { virar: 0, inclinar: 14 });
b.cabeca(5.0, 6.0, { virar: 0, gesto: 'sim' }); b.cabeca(6.0, 7.0, { virar: 0, gesto: 'nao' });
b.cabeca(7.0, 8.0, { virar: 0.5, inclinar: 0, olhar: [3, -5] });
const R = [[0, 1, 'deitado: rosto para cima'], [1, 2, 'levantando'], [2, 4, 'virando a cabeça'], [4, 5, 'inclinar'], [5, 6, 'sim'], [6, 7, 'não'], [7, 8, '¾ olhando para cima']];
window.__duration = 8;
window.__seek = t => { b.desenhar(t); const r = R.find(r => t >= r[0] && t < r[1]); document.querySelector('#rot').textContent = r ? r[2] : ''; };
window.__seek(0);
</script></body></html>
