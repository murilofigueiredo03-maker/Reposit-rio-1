<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sobrevivente: mãos</title>
<!-- Ficha do Sobrevivente no motor de bonecos: vistas, poses e expressões (comparar com ficha-oficial.png).
     Render: node ../../edit/scripts/render.mjs teste.html x.mp4 --width 1920 --height 1080 --frames 0.6 -->
<style>
  html, body { margin: 0; background: #fff; overflow: hidden; }
  @font-face { font-family: 'Luckiest Guy'; src: url(../../identidade-visual/assets/fontes/luckiest-guy.woff2); }
  text { font-family: 'Luckiest Guy', sans-serif; }
</style>
<script src="../../movimento-humano/assets/boneco.js"></script>
<script src="../../objetos-detalhados/assets/detalhes.js"></script>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="outline" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="4" result="d"/><feFlood flood-color="#1D1D2B"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect width="1920" height="70" fill="#111"/><text x="40" y="52" font-size="44" fill="#fff">SOBRE<tspan fill="#FF7A00">VIVENTE</tspan> — MÃOS E GESTOS</text>
  <g id="chao"></g><g id="g"></g><g id="rot"></g>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg', g = document.querySelector('#g'), rot = document.querySelector('#rot');
const rotulo = (x, y, t) => rot.insertAdjacentHTML('beforeend', `<rect x="${x - 85}" y="${y}" width="170" height="34" rx="17" fill="#FFE2C4"/><text x="${x}" y="${y + 26}" font-size="22" text-anchor="middle" fill="#111">${t}</text>`);
// linha 1: modelos de mão (grandes)
const MAOS = [['aberta', 'MÃO ABERTA'], ['punho', 'PUNHO'], ['apontar', 'INDICANDO'], ['joinha', 'JOINHA'], ['baixo', 'POLEGAR P/ BAIXO'], ['paz', 'PAZ'], ['ok', 'OK'], ['n1', 'NÚMERO 1'], ['n3', 'NÚMERO 3'], ['n4', 'NÚMERO 4'], ['n5', 'NÚMERO 5'], ['palma', 'PALMA (PARE)']];
MAOS.forEach(([f, r], i) => { const x = 90 + i * 160, y = 230, gg = document.createElementNS(NS, 'g'); g.appendChild(gg);
  const W = f === 'apontar' ? [x - 30, y] : [x, y + 20], E = f === 'apontar' ? [x - 130, y] : [x, y + 120];
  gg.innerHTML = `<path d="M${E[0]} ${E[1]} L${W[0]} ${W[1]}" stroke="#1D1D2B" stroke-width="22" stroke-linecap="round"/><path d="M${E[0]} ${E[1]} L${W[0]} ${W[1]}" stroke="#fff" stroke-width="14" stroke-linecap="round"/>` + Boneco.desenharMao(f, E, W, { s: 3.2, vista: 'frente', sx: 1 });
  rotulo(x, 330, r); });
// linha 2: movimentos dos braços
const B = [];
const GESTOS = [['explicar', 'ambos', 'EXPLICANDO', 'feliz'], ['parar', 'd', 'PARANDO', 'serio'], ['levantar', 'd', 'BRAÇO LEVANTADO', 'alegre'], ['apontar', 'd', 'APONTANDO', 'determinado'], ['queixo', 'd', 'MÃO NO QUEIXO', 'pensando'],
  ['cintura', 'ambos', 'MÃO NA CINTURA', 'determinado'], ['cruzar', 'ambos', 'BRAÇOS CRUZADOS', 'bravo'], ['joinha', 'd', 'JOINHA', 'alegre'], ['chamar', 'd', 'CHAMANDO', 'feliz'], ['cabeca', 'd', 'MÃO NA CABEÇA', 'triste'], ['contar', 'd', 'CONTANDO (3)', 'normal'], ['acenar', 'd', 'ACENANDO', 'alegre']];
GESTOS.forEach(([ge, lado, r, ex], i) => { const x = 90 + i * 160, y = 900, gg = document.createElementNS(NS, 'g'); g.appendChild(gg);
  const b = new Boneco(gg, { escala: 0.62, figurino: 'sobrevivente', seed: i + 1 });
  b.base(0, 9, 'parado', { x, y, vista: 'frente' }); b.braco(lado, 0, 9, ge, { entrada: 0.01, n: 3 }); b.expressao(0, 9, ex); B.push(b);
  document.querySelector('#chao').insertAdjacentHTML('beforeend', `<ellipse cx="${x}" cy="${y + 2}" rx="70" ry="8" fill="#000" opacity=".12"/>`);
  rotulo(x, y + 18, r); });
window.__seek = t => B.forEach(b => b.desenhar(t));
window.__duration = 3;
window.__seek(0.6);
</script>
</body>
</html>
