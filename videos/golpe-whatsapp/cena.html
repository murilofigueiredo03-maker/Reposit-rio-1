<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Golpe do troquei de número</title>
<style>
  @font-face { font-family: 'Luckiest Guy'; src: url(fontes/luckiest-guy.woff2); }
  @font-face { font-family: 'Anton'; src: url(fontes/anton.woff2); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  text:not([font-family]) { font-family: 'Luckiest Guy', 'DejaVu Sans', sans-serif; }
</style>
<script src="gsap.min.js"></script>
<script src="boneco.js"></script>
<script src="cenario.js"></script>
<script src="cidade.js"></script>
<script src="marca.js"></script>
<script src="legenda.js"></script>
<script src="legenda-dados.js"></script>
</head><body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/><feFlood flood-color="#1D1D2B"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="tela"><rect x="200" y="430" width="680" height="1000" rx="40"/></clipPath>
    <clipPath id="area-chat"><rect x="200" y="560" width="680" height="770"/></clipPath>
    <clipPath id="area-alertas"><rect x="0" y="560" width="1080" height="880"/></clipPath>
    <pattern id="papel" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#ECE5DD"/><circle cx="12" cy="14" r="3" fill="#DDD3C7"/><path d="M38 40 l8 -8 l8 8" stroke="#DDD3C7" stroke-width="3" fill="none"/></pattern>
  </defs>
  <g id="cam">
    <g id="fundo"></g>
    <g id="mae-g"></g>
    <g id="celular"></g>
    <g id="efeitos"></g>
  </g>
  <g id="textos"></g>
  <g id="legenda"></g>
</svg>
<script>
/* ROTEIRO (1080×1920, ~59 s) — formato "conversa no celular" para a Fatos Úteis
   0.3   gancho: "se a sua mãe receber essa mensagem, cuidado: é golpe"
   4.7   conversa: oi mãe · troquei de número (⚠ NÚMERO NOVO) · resposta da mãe
   11.7  pressa: conta pra pagar hoje, app travou (⚠ PRESSA)
   17.4  pede Pix pra conta de outra pessoa (⚠ PIX PRA OUTRA PESSOA)
   22.0  a mãe pede pra ligar · "o microfone quebrou" · "faz logo!!" (⚠ NÃO QUER LIGAR)
   30.6  o que fazer: número antigo · chamada de vídeo · outra pessoa da família · desconfiar de número não salvo
   43.9  proteja o seu WhatsApp: verificação em duas etapas
   48.9  a mãe liga pro número antigo → o Léo de verdade atende: "EU NÃO TROQUEI DE NÚMERO!"
   53.1  "manda pra sua mãe"
   Fontes: orientações contra o golpe do falso parente (confirmar por outro canal, ligar pro número antigo,
   chamada de vídeo, desconfiar de número não salvo). Número e nomes da conversa são fictícios. */
const W = 1080, H = 1920, NS = 'http://www.w3.org/2000/svg', DUR = 59.44;
const $ = q => document.querySelector(q);
const LARANJA = '#FF7A00', L_ = '#1D1D2B', VERDE = '#1F6E5E', VERM = '#D7263D';
const mk = (pai, id) => { const g = document.createElementNS(NS, 'g'); if (id) g.id = id; pai.appendChild(g); return g; };
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');

// ---------- fundo: sala, desfocada e mais escura (o foco é o celular) ----------
$('#fundo').innerHTML = `<g style="filter: blur(6px)">${Cidade(Cenario({ seed: 41, luz: -1, hora: 'interior', prefixo: 'gw' })).sala({ chao: 1500, tv: false, cortina: 'aberta' })}</g><rect width="${W}" height="${H}" fill="#000" opacity=".35"/>`;

// ---------- a mãe (lendo o celular) ----------
const mae = new Boneco($('#mae-g'), { escala: 1.0, seed: 12, figurino: { tronco: 'tunicaLonga', cor: '#8E4AA8', mangas: 'curta', pes: 'sapato', corPes: '#3A2A20', cabelo: 'cacheado', corCabelo: '#5A3A2A', cinto: 'none' } });
mae.base(0, DUR, 'parado', { x: 120, y: 1560, vista: 'frente' });
mae.braco('d', 0, DUR, 'segurar');
[[0, 'feliz'], [8.9, 'pensando'], [13.5, 'preocupado'], [18.5, 'desconfiado'], [22.4, 'pensando'], [25.4, 'desconfiado'], [27.0, 'bravo'], [30.6, 'determinado'], [50.3, 'espanto'], [52.6, 'aliviado']].forEach(([t, e], i, a) => mae.expressao(t, a[i + 1] ? a[i + 1][0] : DUR, e));
mae.cabeca(0, DUR, { olhar: [6, -2], inclinar: -6 });

// ---------- celular ----------
const PX = 200, PY = 430, PW = 680, PH = 1000;
let cel = `<g id="cel"><rect x="${PX - 26}" y="${PY - 26}" width="${PW + 52}" height="${PH + 52}" rx="66" fill="#16161C" stroke="${L_}" stroke-width="6"/><rect x="${PX - 18}" y="${PY - 18}" width="${PW + 36}" height="${PH + 36}" rx="58" fill="none" stroke="#3A3A44" stroke-width="4"/>`;
cel += `<g clip-path="url(#tela)"><rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" fill="url(#papel)"/>`;
// cabeçalho da conversa: foto (o filho), número desconhecido, "online"
const fotoFilho = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#9ED3F0" stroke="#fff" stroke-width="3"/><circle cx="${cx}" cy="${cy + r * 0.15}" r="${r * 0.62}" fill="#fff" stroke="${L_}" stroke-width="3"/><path d="M${cx - r * 0.6} ${cy - r * 0.2} l${r * 0.15} ${-r * 0.42} l${r * 0.15} ${r * 0.18} l${r * 0.18} ${-r * 0.3} l${r * 0.15} ${r * 0.25} l${r * 0.2} ${-r * 0.3} l${r * 0.12} ${r * 0.32} l${r * 0.2} ${-r * 0.1} l-${r * 0.05} ${r * 0.5}Z" fill="#111"/><circle cx="${cx - r * 0.22}" cy="${cy + r * 0.12}" r="${r * 0.08}" fill="#111"/><circle cx="${cx + r * 0.22}" cy="${cy + r * 0.12}" r="${r * 0.08}" fill="#111"/><path d="M${cx - r * 0.2} ${cy + r * 0.38} q${r * 0.2} ${r * 0.16} ${r * 0.4} 0" stroke="#111" stroke-width="3" fill="none"/><path d="M${cx - r * 0.55} ${cy + r * 0.72} q${r * 0.55} ${r * 0.35} ${r * 1.1} 0" stroke="${LARANJA}" stroke-width="${r * 0.22}" fill="none"/>`;
cel += `<rect x="${PX}" y="${PY}" width="${PW}" height="130" fill="${VERDE}"/><path d="M${PX + 30} ${PY + 66} l18 -18 M${PX + 30} ${PY + 66} l18 18" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`
  + fotoFilho(PX + 110, PY + 66, 40)
  + `<text x="${PX + 170}" y="${PY + 60}" font-family="'DejaVu Sans', sans-serif" font-weight="700" font-size="32" fill="#fff">+55 11 9 1234-5678</text><text x="${PX + 170}" y="${PY + 98}" font-family="'DejaVu Sans', sans-serif" font-size="24" fill="#CFEDE6">online</text>`
  + `<g fill="#fff"><circle cx="${PX + PW - 40}" cy="${PY + 50}" r="5"/><circle cx="${PX + PW - 40}" cy="${PY + 66}" r="5"/><circle cx="${PX + PW - 40}" cy="${PY + 82}" r="5"/></g>`;
// barra de digitar
cel += `<rect x="${PX}" y="${PY + PH - 100}" width="${PW}" height="100" fill="#F0F0F0"/><rect x="${PX + 20}" y="${PY + PH - 80}" width="${PW - 130}" height="60" rx="30" fill="#fff"/><text x="${PX + 50}" y="${PY + PH - 40}" font-family="'DejaVu Sans', sans-serif" font-size="26" fill="#999">Mensagem</text><circle cx="${PX + PW - 55}" cy="${PY + PH - 50}" r="34" fill="${VERDE}"/><path d="M${PX + PW - 66} ${PY + PH - 62} l24 12 l-24 12Z" fill="#fff"/>`;
cel += `<g clip-path="url(#area-chat)"><g id="chat"></g></g></g>`;
// tela de ligação (por cima da conversa, aparece no fim)
cel += `<g id="ligacao" style="opacity:0" clip-path="url(#tela)"><rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" fill="#1B3A34"/>`
  + `<g id="lig-chamando"><text x="${W / 2}" y="${PY + 150}" font-family="'DejaVu Sans', sans-serif" font-size="30" fill="#BFE3DA" text-anchor="middle">Ligando para o número antigo...</text>`
  + `<g id="lig-foto">${fotoFilho(W / 2, PY + 420, 130)}</g><text x="${W / 2}" y="${PY + 640}" font-size="64" fill="#fff" text-anchor="middle">LÉO (FILHO)</text>`
  + `<circle cx="${W / 2}" cy="${PY + PH - 140}" r="60" fill="${VERM}"/><path d="M${W / 2 - 30} ${PY + PH - 136} q30 -26 60 0" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/></g>`
  + `<g id="lig-video" style="opacity:0"><rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" fill="#E8D9B8"/><g id="leo-video"></g><rect x="${PX + PW - 190}" y="${PY + 40}" width="160" height="220" rx="16" fill="#8E4AA8" stroke="#fff" stroke-width="4"/><text x="${PX + PW - 110}" y="${PY + 160}" font-size="30" fill="#fff" text-anchor="middle">MÃE</text></g></g>`;
cel += `<rect x="${W / 2 - 80}" y="${PY - 14}" width="160" height="18" rx="9" fill="#16161C"/></g>`;
$('#celular').innerHTML = cel;
// o Léo de verdade, na chamada de vídeo (dentro da tela)
const leo = new Boneco($('#leo-video'), { escala: 1.15, seed: 6, figurino: 'sobrevivente' });
leo.base(0, DUR, 'parado', { x: W / 2, y: PY + PH + 260, vista: 'frente' });
leo.braco('ambos', 50.6, 52.6, 'desespero');
leo.braco('d', 52.8, DUR, 'apontar');
leo.expressao(0, 52.6, 'espanto'); leo.expressao(52.6, DUR, 'serio');
$('#leo-video').setAttribute('clip-path', 'url(#tela)');

// ---------- mensagens ----------
const MSGS = [   // [quem: 'ele' | 'mae', linhas, hora, aparece em, alerta]
  ['ele', ['Oi mãe, tudo bem?'], '14:02', 5.25],
  ['ele', ['Troquei de número,', 'salva esse aqui'], '14:02', 8.95, 'NÚMERO NOVO'],
  ['mae', ['Oi filho! Salvei sim'], '14:03', 10.4],
  ['ele', ['Mãe, tô com um', 'probleminha...'], '14:03', 12.1],
  ['ele', ['Preciso pagar uma conta', 'HOJE e o app do banco', 'travou'], '14:04', 13.5, 'PRESSA'],
  ['ele', ['Faz um Pix de R$ 1.500', 'pra mim? Amanhã', 'te devolvo'], '14:04', 17.55],
  ['ele', ['A chave tá no nome', 'de um amigo, tá?'], '14:05', 18.5, 'PIX PRA OUTRA PESSOA'],
  ['mae', ['Me liga, filho?'], '14:05', 22.6],
  ['ele', ['Não dá mãe, o microfone', 'do celular quebrou'], '14:06', 25.4],
  ['ele', ['Faz logo, por favor!!', 'É urgente'], '14:06', 27.0, 'NÃO QUER LIGAR'],
];
const chat = $('#chat'), alertas = mk(mk($('#efeitos'), 'alertas-clip'), 'alertas');
$('#alertas-clip').setAttribute('clip-path', 'url(#area-alertas)');
let y = 590; const posY = [];
MSGS.forEach(([quem, linhas, hora, t, alerta], i) => {
  const h = linhas.length * 44 + 52, w = Math.max(...linhas.map(l => l.length)) * 17.5 + 120, x = quem === 'ele' ? PX + 24 : PX + PW - 24 - w;
  const cor = quem === 'ele' ? '#fff' : '#DCF8C6';
  const g = mk(chat, 'm' + i); g.style.opacity = 0;
  g.innerHTML = `<rect x="${x + 3}" y="${y + 4}" width="${w}" height="${h}" rx="22" fill="#000" opacity=".12"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="${cor}"/>`
    + linhas.map((l, k) => `<text x="${x + 26}" y="${y + 50 + k * 44}" font-family="'DejaVu Sans', sans-serif" font-size="33" fill="#111">${esc(l)}</text>`).join('')
    + `<text x="${x + w - 18}" y="${y + h - 14}" font-family="'DejaVu Sans', sans-serif" font-size="20" fill="#888" text-anchor="end">${hora}${quem === 'mae' ? ' ✓✓' : ''}</text>`;
  if (alerta) {
    const a = mk(alertas, 'a' + i); a.style.opacity = 0;
    const aw = Marca.largura('⚠ ' + alerta, 40) + 70, ax = Math.min(W - 30 - aw, x + w - 40), ay = y + h - 10;
    a.innerHTML = `<g transform="rotate(-4 ${ax + aw / 2} ${ay})"><rect x="${ax + 6}" y="${ay - 34}" width="${aw}" height="72" rx="36" fill="#000" opacity=".35"/><rect x="${ax}" y="${ay - 40}" width="${aw}" height="72" rx="36" fill="${VERM}" stroke="#111" stroke-width="5"/><text x="${ax + aw / 2}" y="${ay + 9}" font-size="40" fill="#fff" text-anchor="middle">⚠ ${alerta}</text></g>`;
    a.dataset.ox = ax + aw / 2; a.dataset.oy = ay;
  }
  posY.push([y, y + h]); y += h + 22;
});
// "digitando…" antes de cada mensagem dele
const dig = mk(chat, 'digitando'); dig.style.opacity = 0;
dig.innerHTML = `<rect id="dig-r" x="${PX + 24}" y="0" width="130" height="64" rx="22" fill="#fff"/>${[0, 1, 2].map(k => `<circle class="pt" cx="${PX + 62 + k * 28}" cy="32" r="9" fill="#9AA0A8"/>`).join('')}`;

// ---------- textos ----------
const T = $('#textos');
const add = (id, svg) => { const g = mk(T, id); g.innerHTML = svg; g.style.opacity = 0; };
add('t-golpe', Marca.carimbo(540, 1600, 'É GOLPE!', { fs: 120 }));
add('t-dicas', `<rect x="${PX - 26}" y="${PY - 26}" width="${PW + 52}" height="${PH + 52}" rx="66" fill="#111" opacity=".88"/>` + Marca.faixa(540, 560, 'ANTES DE PAGAR:', { fs: 74 }));
const dica = (id, yy, t1, t2) => add(id, `<rect x="220" y="${yy - 70}" width="640" height="180" rx="30" fill="#2A2A30" stroke="${LARANJA}" stroke-width="6"/><circle cx="300" cy="${yy + 20}" r="44" fill="${LARANJA}"/><path d="M278 ${yy + 20} l16 18 l30 -36" stroke="#111" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` + Marca.texto(370, yy + 6, t1, { fs: 40, cor: '#fff', ancora: 'start', sombra: false }) + Marca.texto(370, yy + 58, t2, { fs: 40, cor: LARANJA, ancora: 'start', sombra: false }));
dica('t-d1', 740, 'LIGUE PRO', 'NÚMERO ANTIGO');
dica('t-d2', 940, 'FAÇA UMA', 'CHAMADA DE VÍDEO');
dica('t-d3', 1140, 'CONFIRME COM ALGUÉM', 'DA FAMÍLIA');
dica('t-d4', 1340, 'DESCONFIE DE NÚMERO', 'NÃO SALVO');
// proteção do WhatsApp: verificação em duas etapas
const cadeado = `<g transform="translate(540 900)"><path d="M-80 -60 V-120 a80 80 0 0 1 160 0 V-60" fill="none" stroke="#9AA0A8" stroke-width="30"/><rect x="-130" y="-70" width="260" height="210" rx="30" fill="#F2B705" stroke="#111" stroke-width="8"/><circle cx="0" cy="20" r="26" fill="#111"/><path d="M0 30 v50" stroke="#111" stroke-width="20" stroke-linecap="round"/></g>`;
add('t-2fa', `<rect x="${PX - 26}" y="${PY - 26}" width="${PW + 52}" height="${PH + 52}" rx="66" fill="#111" opacity=".92"/>` + Marca.faixa(540, 560, 'PROTEJA O SEU WHATSAPP', { fs: 56 })
  + `<g id="t-2fa-c">${cadeado}</g>` + Marca.texto(540, 1170, 'ATIVE A VERIFICAÇÃO', { fs: 56, cor: '#fff', sombra: false }) + Marca.texto(540, 1240, 'EM DUAS ETAPAS', { fs: 66, cor: LARANJA, sombra: false })
  + Marca.texto(540, 1330, 'ASSIM NINGUÉM CLONA A SUA CONTA', { fs: 34, cor: '#ccc', sombra: false }));
add('t-balao', Marca.balao(540, 640, 'EU NÃO TROQUEI DE NÚMERO!', { fs: 46, ponta: [-40, 150] }));
add('t-cta', Marca.carimbo(540, 1610, 'MANDA PRA SUA MÃE!', { fs: 84 }) + `<g transform="translate(540 1750)"><rect x="-260" y="-48" width="520" height="86" rx="43" fill="${LARANJA}"/><text y="14" font-size="40" text-anchor="middle" fill="#111">COMPARTILHA ↓</text></g>`);

// ---------- legenda ----------
const leg = Legenda($('#legenda'), LEGENDA, { y: 330, fs: 66, enfase: ['GOLPE', 'NÚMERO', 'NOVO', 'PRESSA', 'PIX', 'ANTIGO', 'VÍDEO', 'MÃE'] });

// ---------- timeline ----------
const tl = gsap.timeline({ paused: true });
const pop = (sel, t, dur, ox, oy) => {
  tl.fromTo(sel, { opacity: 0, scale: 0.2, svgOrigin: `${ox} ${oy}` }, { opacity: 1, scale: 1, duration: 0.32, ease: 'back.out(2.2)' }, t);
  if (dur) tl.to(sel, { opacity: 0, scale: 0.85, duration: 0.16, ease: 'power2.in' }, t + dur);
};
// celular entra de baixo; câmera aproxima devagar
tl.fromTo('#celular', { y: 1300 }, { y: 0, duration: 0.7, ease: 'back.out(1.2)' }, 0.2);
tl.fromTo('#cam', { scale: 1.0, svgOrigin: '540 930' }, { scale: 1.05, duration: 30, ease: 'sine.inOut' }, 0);
pop('#t-golpe', 2.85, 1.9, 540, 1600);
// mensagens (com "digitando…" antes das dele) e rolagem do chat quando enche
const BASE = 1330;
let rol = 0;
MSGS.forEach(([quem, , , t, alerta], i) => {
  if (quem === 'ele') {
    tl.set('#dig-r', { attr: { y: posY[i][0] } }, t - 0.9); tl.set('.pt', { attr: { cy: posY[i][0] + 32 } }, t - 0.9);
    tl.fromTo('#digitando', { opacity: 0 }, { opacity: 1, duration: 0.1 }, t - 0.85);
    tl.to('#digitando', { opacity: 0, duration: 0.05 }, t - 0.05);
  }
  const falta = posY[i][1] - rol - BASE;
  if (falta > 0) { rol += falta + 10; tl.to(['#chat', '#alertas'], { y: -rol, duration: 0.3, ease: 'power2.out' }, t - 0.05); }
  tl.fromTo('#m' + i, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: 'back.out(2)' }, t);
  if (alerta) { const a = $('#a' + i); tl.fromTo('#a' + i, { opacity: 0, scale: 0.2, svgOrigin: `${a.dataset.ox} ${a.dataset.oy}` }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.4)' }, t + 0.35); }
});
tl.to('.pt', { y: -8, duration: 0.18, yoyo: true, repeat: 99, stagger: 0.09, ease: 'sine.inOut' }, 3.5);
// o que fazer
tl.to('#t-dicas', { opacity: 1, duration: 0.3 }, 30.6);
tl.to('#alertas-clip', { opacity: 0, duration: 0.25 }, 30.6);
[31.55, 33.6, 35.5, 37.55].forEach((t, i) => tl.fromTo('#t-d' + (i + 1), { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.35, ease: 'back.out(1.8)' }, t));
tl.to(['#t-dicas', '#t-d1', '#t-d2', '#t-d3', '#t-d4'], { opacity: 0, duration: 0.25 }, 43.8);
tl.to('#t-2fa', { opacity: 1, duration: 0.3 }, 43.9);
tl.fromTo('#t-2fa-c', { scale: 0.3, svgOrigin: '540 900' }, { scale: 1, duration: 0.45, ease: 'back.out(2.2)' }, 45.95);
tl.to('#t-2fa-c', { rotation: 6, svgOrigin: '540 900', duration: 0.12, yoyo: true, repeat: 5, ease: 'sine.inOut' }, 46.5);
tl.to('#t-2fa', { opacity: 0, duration: 0.25 }, 48.8);
// a mãe liga pro número antigo… e o Léo de verdade atende
tl.to('#ligacao', { opacity: 1, duration: 0.3 }, 48.9);
tl.to('#lig-foto', { scale: 1.08, svgOrigin: `${W / 2} ${PY + 420}`, duration: 0.25, yoyo: true, repeat: 5, ease: 'sine.inOut' }, 49.0);
tl.to('#lig-video', { opacity: 1, duration: 0.2 }, 50.3);
pop('#t-balao', 50.55, 0, 540, 640);
tl.to('#cam', { x: 8, duration: 0.05, yoyo: true, repeat: 5, ease: 'none' }, 50.55);
tl.to('#t-balao', { opacity: 0, duration: 0.2 }, 52.9);
pop('#t-cta', 53.1, 0, 540, 1610);
tl.to('#t-cta', { scale: 1.04, svgOrigin: '540 1610', duration: 0.3, yoyo: true, repeat: 9, ease: 'sine.inOut' }, 53.6);
tl.set({}, {}, DUR);

// ---------- relógio externo (skill edit) ----------
window.__timeline = tl;
window.__duration = DUR;
window.__seek = t => { tl.seek(t, false); mae.desenhar(t); if (t > 50.2) leo.desenhar(t); leg.seek(t); };
window.__seek(0);
</script></body></html>
