<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>O que fazer se — 5 emergências</title>
<style>
  @font-face { font-family: 'Luckiest Guy'; src: url(fontes/luckiest-guy.woff2); }
  @font-face { font-family: 'Anton'; src: url(fontes/anton.woff2); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; display: block; }
  text:not([font-family]) { font-family: 'Luckiest Guy', 'DejaVu Sans', sans-serif; }
</style>
<script src="gsap.min.js"></script>
<script src="boneco.js"></script>
<script src="animal.js"></script>
<script src="cenario.js"></script>
<script src="cidade.js"></script>
<script src="marca.js"></script>
<script src="legenda.js"></script>
<script src="legenda-dados.js"></script>
</head><body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="outline" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/><feFlood flood-color="#1D1D2B"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="fumaca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2A30" stop-opacity=".95"/><stop offset=".7" stop-color="#4A4A52" stop-opacity=".75"/><stop offset="1" stop-color="#4A4A52" stop-opacity="0"/></linearGradient></defs>
  <g id="cam">
    <g id="cenarios"></g>
    <g id="carro-fundo"></g>
    <g id="atores"></g>
    <g id="carro-frente"></g>
    <g id="efeitos"></g>
    <g id="acabamento"></g>
  </g>
  <g id="textos"></g>
  <g id="numero" style="opacity:0"></g>
  <g id="final" style="opacity:0"></g>
  <g id="legenda"></g>
</svg>
<script>
/* ROTEIRO (1080×1920, 69 s) — tempos casados com a narração (voz/fala.wav, transcript.json)
   0–6.8     INTRO: "5 situações em que o seu instinto pode te colocar em perigo"
   6.8–20.8  1 ENGASGO: não esperar · 192 · 5 tapas nas costas + 5 compressões (Heimlich), repetir   [AHA 2025, SAMU]
   20.8–32.1 2 INCÊNDIO: não sair de pé · sair abaixado · nunca elevador · 193                     [Corpo de Bombeiros]
   32.1–43.2 3 CHOQUE: não encostar · desligar o disjuntor · ou afastar com madeira seca · SAMU     [primeiros socorros]
   43.2–52.6 4 CACHORRO: não correr nem gritar · parado como árvore · de lado, sem encarar          [CDC]
   52.6–63.3 5 CARRO NA ÁGUA: porta não abre · cinto · janela · sair na hora · criança primeiro     [Giesbrecht, U. Manitoba]
   63.3–69.1 "qual dessas você não sabia? comenta e manda pra quem precisa ver" + 192/193 */
const W = 1080, H = 1920, Y = 1490, S = 1.1, NS = 'http://www.w3.org/2000/svg';
const $ = q => document.querySelector(q);
const DUR = 69.14, LARANJA = '#FF7A00', L_ = '#1D1D2B';
const CENAS = { intro: [0, 6.8], engasgo: [6.8, 20.8], fogo: [20.8, 32.1], choque: [32.1, 43.2], cao: [43.2, 52.6], carro: [52.6, 63.3] };
const mk = (pai, id) => { const g = document.createElementNS(NS, 'g'); if (id) g.id = id; pai.appendChild(g); return g; };
const Cn = (seed, hora, prefixo) => Cenario({ seed, luz: -1, hora, prefixo });

// ---------- cenários ----------
const cen = {};
cen.intro = Cidade(Cn(21, 'tarde', 'in')).rua({ chao: 1500, caos: false });
cen.engasgo = Cidade(Cn(22, 'interior', 'en')).sala({ chao: 1300, cortina: 'aberta', tv: false });
cen.fogo = Cidade(Cn(23, 'interior', 'fo')).sala({ chao: 1300, cortina: 'fechada', tv: false, porta: 'aberta', cor: '#D9C9A8' })
  + `<g id="fogo">${Cidade(Cn(24, 'interior', 'fg')).fogueira(190, 1330, 1.7)}</g>`
  + `<g id="fumaca-g"><rect id="fumaca-r" x="0" y="0" width="${W}" height="700" fill="url(#fumaca)"/>${[...Array(9)].map((_, i) => `<circle class="nuvem-f" cx="${60 + i * 120}" cy="${560 + (i % 3) * 40}" r="${90 + (i % 2) * 40}" fill="#3A3A42" opacity=".6"/>`).join('')}</g>`;
// choque: tomada com fio desencapado e quadro de luz com disjuntor (alavanca animável)
cen.choque = Cidade(Cn(25, 'interior', 'ch')).sala({ chao: 1300, cortina: 'aberta', tv: false, cor: '#E3E8D8' })
  + `<g transform="translate(860 1150)"><rect x="-34" y="-46" width="68" height="92" rx="10" fill="#F4F1EA" stroke="${L_}" stroke-width="5"/><circle cx="-12" cy="-6" r="7" fill="${L_}"/><circle cx="12" cy="-6" r="7" fill="${L_}"/><circle cx="0" cy="18" r="6" fill="${L_}"/></g>`
  + `<path d="M840 1150 Q760 1180 760 1250 Q760 1290 700 1300" stroke="#2A2A30" stroke-width="10" fill="none"/><path d="M752 1238 l16 10 M748 1252 l18 4" stroke="#C9A24A" stroke-width="5"/>`
  + `<g transform="translate(140 720)"><rect x="-80" y="-120" width="160" height="240" rx="12" fill="#9AA0A8" stroke="${L_}" stroke-width="6"/><rect x="-62" y="-100" width="124" height="200" rx="6" fill="#C9CFD5" stroke="${L_}" stroke-width="3"/>`
  + `${[0, 1, 2, 3].map(i => `<rect x="${-48 + (i % 2) * 54}" y="${-80 + Math.floor(i / 2) * 70}" width="42" height="54" rx="4" fill="#5E666E" stroke="${L_}" stroke-width="3"/>`).join('')}`
  + `<g id="alavanca"><rect x="-44" y="-74" width="34" height="22" rx="4" fill="${LARANJA}" stroke="${L_}" stroke-width="3"/></g><path d="M-14 -150 l-14 24 h20 l-14 24" stroke="#F2B705" stroke-width="7" fill="none"/></g>`
  + `<text x="140" y="890" font-family="'Anton', sans-serif" font-size="30" fill="${L_}" text-anchor="middle">QUADRO DE LUZ</text>`;
cen.cao = Cidade(Cn(26, 'dia', 'ca')).rua({ chao: 1500, caos: false });
cen.carro = Cidade(Cn(27, 'dia', 'la')).lago({ chao: 1150 });
Object.entries(cen).forEach(([k, s]) => { const g = mk($('#cenarios'), 'sc-' + k); g.innerHTML = s; g.style.opacity = k === 'intro' ? 1 : 0; });
const C0 = Cn(3, 'tarde', 'ac');
$('#acabamento').innerHTML = `<defs>${C0.defs()}</defs>` + C0.atmosfera({ grao: 0.22 });

// carro na água: carro em duas camadas (motorista dentro) + água subindo por cima
const Zc = Cidade(Cn(28, 'dia', 'cc'));
const CK = 1.45, CXc = 600, CYc = 1440;
$('#carro-fundo').innerHTML = `<g id="cf" style="opacity:0">${Zc.carro(CXc, CYc, CK, { cor: '#D7263D', camada: 'fundo' })}</g>`;
$('#carro-frente').innerHTML = `<g id="cfr" style="opacity:0">${Zc.carro(CXc, CYc, CK, { cor: '#D7263D', camada: 'frente' })}</g>`
  + `<g id="agua" style="opacity:0"><rect id="agua-r" x="0" y="1330" width="${W}" height="700" fill="#2F86C0" opacity=".78"/><path id="agua-o" d="M0 1330 q60 -18 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" stroke="#CFEAF6" stroke-width="8" fill="none"/></g>`;
// raios do choque
$('#efeitos').innerHTML = `<g id="raios" style="opacity:0">${[[600, 900], [780, 980], [560, 1120], [820, 1250], [700, 830]].map(([x, y]) => `<path d="M${x} ${y} l20 -34 l-14 0 l24 -40" stroke="#F2E205" stroke-width="9" fill="none" stroke-linejoin="round"/><path d="M${x} ${y} l20 -34 l-14 0 l24 -40" stroke="#fff" stroke-width="3" fill="none"/>`).join('')}</g>`
  + `<g id="xis" style="opacity:0"><circle cx="560" cy="760" r="80" fill="#D7263D" stroke="${L_}" stroke-width="7"/><path d="M520 720 l80 80 M600 720 l-80 80" stroke="#fff" stroke-width="18" stroke-linecap="round"/></g>`
  + `<g id="tosse" style="opacity:0">${[0, 1, 2].map(i => `<circle cx="${640 + i * 34}" cy="${760 - i * 26}" r="${12 + i * 6}" fill="#8A8A90" opacity=".8"/>`).join('')}</g>`;

// ---------- personagens ----------
const atores = [];
const novo = (opts, de, ate) => { const g = mk($('#atores')), b = new Boneco(g, opts); b._g = g; b._de = de; b._ate = ate; atores.push(b); return b; };
const leo = novo({ escala: S, figurino: 'sobrevivente', seed: 6 }, 0, DUR);
const fr = (x, y = Y, extra = {}) => ({ x, y, vista: 'frente', transicao: 0.25, ...extra });
const pf = (x, dir = 1, y = Y, extra = {}) => ({ x, y, vista: 'perfil', dir, passada: 14, transicao: 0.25, ...extra });
// INTRO
leo.base(0, 6.8, 'parado', fr(540));
leo.braco('d', 0.3, 2.2, 'contar', { n: 5 });
leo.braco('ambos', 2.4, 3.6, 'desespero');
leo.braco('d', 3.9, 6.6, 'explicar');
leo.expressao(0, 2.3, 'determinado'); leo.expressao(2.3, 3.7, 'medo'); leo.expressao(3.7, 6.8, 'alegre');
// 1 ENGASGO — vítima de perfil olhando para a direita; Léo atrás dela (à esquerda)
const VX = 640;
const vit = novo({ escala: 1.08, seed: 30, figurino: 'casual' }, 6.8, 20.8);
vit.base(6.8, 20.8, 'parado', pf(VX, 1, Y));
const pescoco = [VX + 26, Y - 470], costas = [VX - 46, Y - 380], barriga = [VX + 30, Y - 300];
vit.braco('ambos', 6.9, 19.1, 'alcancar', { alvo: pescoco });
vit.expressao(6.8, 19.1, 'espanto'); vit.expressao(19.1, 20.8, 'aliviado');
vit.cabeca(19.2, 20.6, { gesto: 'sim' });
leo.base(6.8, 13.2, 'parado', fr(260));
leo.base(13.2, 20.8, 'parado', pf(VX - 150, 1));
leo.braco('ambos', 7.4, 10.4, 'desespero');
leo.braco('d', 11.4, 13.1, 'contar', { n: 1 });
leo.formaMao('d', 11.4, 13.1, 'punho');
for (let k = 0; k < 5; k++) { const t0 = 13.45 + k * 0.38; leo.braco('d', t0, t0 + 0.19, 'alcancar', { alvo: [costas[0] - 40, costas[1] - 30], transicao: 0.08 }); leo.braco('d', t0 + 0.19, t0 + 0.38, 'alcancar', { alvo: costas, transicao: 0.08 }); }
for (let k = 0; k < 5; k++) { const t0 = 15.5 + k * 0.56; leo.braco('ambos', t0, t0 + 0.28, 'alcancar', { alvo: [barriga[0] - 20, barriga[1] + 14], transicao: 0.1 }); leo.braco('ambos', t0 + 0.28, t0 + 0.56, 'alcancar', { alvo: [barriga[0] + 4, barriga[1] - 18], transicao: 0.1 }); }
leo.braco('d', 19.3, 20.7, 'joinha');
leo.expressao(6.8, 11.3, 'susto'); leo.expressao(11.3, 19.2, 'determinado'); leo.expressao(19.2, 20.8, 'aliviado');
// 2 INCÊNDIO — primeiro de pé (errado), depois agachado até a porta (direita)
leo.base(20.8, 23.4, 'parado', fr(420));
leo.base(23.4, 24.5, 'correr', { de: [420, Y], ate: [600, Y] });
leo.base(24.5, 26.5, 'parado', pf(600, 1));
leo.base(26.5, 29.6, 'andar', { de: [600, Y], ate: [860, Y], gait: { quadril: 150, inclina: 40, passo: 70, bracos: 10, elevar: 22 } });
leo.base(29.6, 32.1, 'agachar', { x: 860, y: Y, vista: 'perfil', quanto: 80, dir: 1 });
leo.braco('ambos', 20.9, 23.2, 'desespero');
leo.braco('d', 24.6, 26.4, 'nariz');
leo.braco('e', 24.6, 26.4, 'testa');
leo.braco('d', 30.0, 32.0, 'contar', { n: 1 });
leo.expressao(20.8, 23.4, 'medo'); leo.expressao(23.4, 26.5, 'tonto'); leo.expressao(26.5, 32.1, 'determinado');
// 3 CHOQUE — vítima encostando na tomada; Léo quase toca, para, e vai ao quadro de luz
const vc = novo({ escala: 1.08, seed: 31, figurino: { preset: 'aluno', cor: '#7A4AA8' } }, 32.1, 43.2);
vc.base(32.1, 38.3, 'parado', pf(700, 1));
vc.base(38.3, 43.2, 'deitado', { x: 690, y: Y - 10, dir: 1, transicao: 0.5 });
vc.braco('d', 32.2, 38.3, 'alcancar', { alvo: [830, 1160] });
vc.braco('e', 32.2, 38.3, 'desespero');
vc.expressao(32.1, 38.3, 'tonto'); vc.expressao(38.3, 43.2, 'dormindo');
leo.base(32.1, 33.6, 'correr', { de: [100, Y], ate: [470, Y] });
leo.base(33.6, 36.9, 'parado', pf(470, 1));
leo.base(36.9, 37.8, 'andar', { de: [470, Y], ate: [260, Y] });
leo.base(37.8, 41.2, 'parado', pf(260, -1));
leo.base(41.2, 43.2, 'parado', fr(420));
leo.braco('d', 33.8, 34.6, 'estender');
leo.braco('ambos', 34.7, 36.8, 'parar');
leo.braco('d', 37.8, 38.8, 'alcancar', { alvo: [125, 655] });
leo.braco('d', 39.3, 41.0, 'apontar');
leo.braco('d', 41.4, 43.1, 'contar', { n: 1 });
leo.expressao(32.1, 34.6, 'susto'); leo.expressao(34.6, 37.0, 'espanto'); leo.expressao(37.0, 43.2, 'determinado');
// 4 CACHORRO — o cão vem correndo da direita, late, desiste e vai embora; Léo parado de lado
const gCao = mk($('#atores'));
const cao = new Animal(gCao, { especie: 'cachorro', escala: 0.95, seed: 4, cores: { cor: '#6B4A2E', longe: '#4E3420', barriga: '#C9A27A' } });
cao._de = 43.2; cao._ate = 52.6; cao._g = gCao;
cao.base(43.2, 44.2, 'parado', { x: 1300, y: 1510, dir: -1 });
cao.base(44.2, 45.9, 'correr', { de: [1300, 1510], ate: [800, 1510] });
cao.base(45.9, 50.4, 'parado', { x: 800, y: 1510, dir: -1 });
cao.base(50.4, 52.6, 'andar', { de: [800, 1510], ate: [1250, 1510] });
cao.cabeca(46.0, 46.9, { rugir: true }); cao.cabeca(47.3, 48.0, { rugir: true }); cao.cabeca(48.6, 50.2, { baixar: 14, olhar: [-6, 4] });
leo.base(43.2, 47.2, 'parado', fr(330));
leo.base(47.2, 52.6, 'parado', pf(330, -1, Y, { passada: 4 }));
leo.braco('ambos', 46.0, 47.1, 'desespero');
leo.braco('ambos', 47.3, 52.5, 'pose', { o: 2, c: 4 });
leo.cabeca(47.4, 51.8, { baixar: 10, virar: -1, olhar: [-4, 4] });
leo.expressao(43.2, 47.2, 'medo'); leo.expressao(47.2, 51.2, 'serio'); leo.expressao(51.2, 52.6, 'aliviado');
// 5 CARRO NA ÁGUA — Léo ao volante; solta o cinto, abre a janela, sai; criança sai primeiro
const P = Zc.carro.pontos, pto = ([px, py]) => [CXc + px * CK, CYc + py * CK];
leo.base(52.6, 60.1, 'montar', { assento: pto(P.assento), pe: pto(P.pe), guidao: pto(P.guidao), chao: CYc, dir: 1 });
leo.base(60.4, 63.3, 'parado', fr(800, 1170, { transicao: 0 }));
leo.braco('d', 57.5, 58.3, 'alcancar', { alvo: [pto(P.assento)[0] + 10, pto(P.assento)[1] - 40] });
leo.braco('e', 58.4, 59.9, 'estender');
leo.braco('d', 61.2, 63.2, 'joinha');
leo.expressao(52.6, 57.4, 'susto'); leo.expressao(57.4, 60.1, 'determinado'); leo.expressao(60.1, 63.3, 'aliviado');
const crianca = novo({ escala: 0.72, seed: 33, figurino: { preset: 'casual', cor: '#F2B705' } }, 60.0, 63.3);
crianca.base(60.0, 63.3, 'parado', fr(950, 1170));
crianca.expressao(60.0, 63.3, 'feliz'); crianca.braco('d', 61.6, 63.2, 'acenar');

// ---------- textos ----------
const T = $('#textos');
const add = (id, svg) => { const g = mk(T, id); g.innerHTML = svg; g.style.opacity = 0; };
add('t-titulo', Marca.faixa(540, 470, 'O QUE FAZER SE...', { fs: 84 }));
add('t-5', Marca.impacto(540, 660, '5 SITUAÇÕES', { fs: 140 }));
add('t-verdade', Marca.apoio(540, 800, 'E O QUE FAZER DE VERDADE', { fs: 56 }));
// selo: vantagem (✓ laranja) ou erro (✗ branco) em pílula preta
const selo = (x, y, t, bom) => {
  const fs = 38, w = Marca.largura(t, fs) + 108, h = 62;
  const icone = bom ? `<circle cx="${x + 32}" cy="${y}" r="20" fill="${LARANJA}"/><path d="M${x + 22} ${y} l7 8 l14 -16" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
                    : `<circle cx="${x + 32}" cy="${y}" r="20" fill="#D7263D"/><path d="M${x + 24} ${y - 8} l16 16 M${x + 40} ${y - 8} l-16 16" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`;
  return `<rect x="${x + 7}" y="${y - h / 2 + 7}" width="${w}" height="${h}" rx="${h / 2}" fill="#000" opacity=".35"/><rect x="${x}" y="${y - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="#111"/>${icone}<text x="${x + 64}" y="${y + fs * 0.36}" font-size="${fs}" fill="${bom ? LARANJA : '#fff'}">${t}</text>`;
};
const SITU = [   // id, número, título, selos [texto, certo?, instante]
  ['engasgo', '1', 'ENGASGO', [['ESPERAR PASSAR', 0, 10.5], ['LIGAR 192 (SAMU)', 1, 11.5], ['5 TAPAS NAS COSTAS', 1, 13.35], ['5 COMPRESSÕES NA BARRIGA', 1, 15.45], ['REPETIR ATÉ DESENGASGAR', 1, 18.4]]],
  ['fogo', '2', 'INCÊNDIO', [['SAIR CORRENDO DE PÉ', 0, 23.5], ['SAIR ABAIXADO, RENTE AO CHÃO', 1, 26.6], ['USAR O ELEVADOR', 0, 28.1], ['LIGAR 193 (BOMBEIROS)', 1, 29.6]]],
  ['choque', '3', 'CHOQUE ELÉTRICO', [['ENCOSTAR NA PESSOA', 0, 34.1], ['DESLIGAR O DISJUNTOR', 1, 37.1], ['OU AFASTAR COM MADEIRA SECA', 1, 39.3], ['CHAMAR O SAMU (192)', 1, 41.5]]],
  ['cao', '4', 'CACHORRO BRAVO', [['CORRER E GRITAR', 0, 46.3], ['PARADO COMO UMA ÁRVORE', 1, 47.4], ['DE LADO, SEM ENCARAR', 1, 49.4]]],
  ['carro', '5', 'CARRO NA ÁGUA', [['TENTAR ABRIR A PORTA', 0, 54.8], ['SOLTAR O CINTO', 1, 57.5], ['ABRIR OU QUEBRAR A JANELA', 1, 58.4], ['SAIR NA HORA', 1, 60.0], ['CRIANÇA SAI PRIMEIRO', 1, 60.6]]],
];
SITU.forEach(([id, n, nome, selos]) => {
  add('tt-' + id, Marca.faixa(540, 470, n + ' · ' + nome, { fs: 80 }));
  selos.forEach(([t, bom], i) => add(`ts-${id}-${i}`, selo(50, 590 + i * 78, t, bom)));
});
// número da situação em tela cheia (transição)
$('#numero').innerHTML = `<rect width="${W}" height="${H}" fill="${LARANJA}"/><g opacity=".12" fill="#111">${[0, 1, 2, 3, 4].map(k => `<rect x="${60 + k * 230}" y="0" width="70" height="${H}"/>`).join('')}</g>`
  + `<circle cx="540" cy="900" r="250" fill="#111"/><text id="num-txt" x="540" y="1000" font-size="300" fill="${LARANJA}" text-anchor="middle">1</text>`
  + `<text x="540" y="1260" font-size="96" fill="#111" text-anchor="middle">SITUAÇÃO</text>`;
// final
$('#final').innerHTML = `<rect width="${W}" height="${H}" fill="#111"/><g opacity=".14" fill="${LARANJA}">${[0, 1, 2, 3, 4].map(k => `<rect x="${60 + k * 230}" y="0" width="70" height="${H}"/>`).join('')}</g>`
  + `<g id="fim-t">${Marca.texto(540, 600, 'QUAL DESSAS', { fs: 100, cor: '#fff', sombra: false })}${Marca.impacto(540, 740, 'VOCÊ NÃO SABIA?', { fs: 110 })}</g>`
  + `<g id="fim-n" style="opacity:0"><rect x="150" y="860" width="360" height="150" rx="24" fill="#2A2A30" stroke="${LARANJA}" stroke-width="5"/>${Marca.texto(330, 935, 'SAMU', { fs: 48, cor: '#fff', sombra: false })}${Marca.texto(330, 990, '192', { fs: 56, cor: LARANJA, sombra: false })}`
  + `<rect x="570" y="860" width="360" height="150" rx="24" fill="#2A2A30" stroke="${LARANJA}" stroke-width="5"/>${Marca.texto(750, 935, 'BOMBEIROS', { fs: 48, cor: '#fff', sombra: false })}${Marca.texto(750, 990, '193', { fs: 56, cor: LARANJA, sombra: false })}</g>`
  + `<g id="fim-c" transform="translate(540 1160)"><rect x="-430" y="-62" width="860" height="110" rx="55" fill="${LARANJA}"/><text y="18" font-size="46" text-anchor="middle" fill="#111">COMENTA E MANDA PRA ALGUÉM ↓</text></g>`
  + `<text x="540" y="1330" font-family="'DejaVu Sans', sans-serif" font-size="23" fill="#9A9AA2" text-anchor="middle">Conteúdo informativo. Em emergência, ligue 192 ou 193.</text>`
  + `<text x="540" y="1362" font-family="'DejaVu Sans', sans-serif" font-size="23" fill="#9A9AA2" text-anchor="middle">Fontes: AHA 2025, SAMU, Corpo de Bombeiros, CDC, Univ. de Manitoba</text>`;

// ---------- legenda ----------
const leg = Legenda($('#legenda'), LEGENDA, { y: 330, fs: 70, enfase: ['5', '192', '193', 'HEIMLICH', 'SAMU', 'ÁRVORE', 'JANELA', 'CINTO', 'NÃO', 'NUNCA', 'COMENTA'] })
  .esconder([[63.3, 99]]);

// ---------- timeline ----------
const tl = gsap.timeline({ paused: true });
const pop = (sel, t, dur, ox, oy) => {
  tl.fromTo(sel, { opacity: 0, scale: 0.2, svgOrigin: `${ox} ${oy}` }, { opacity: 1, scale: 1, duration: 0.32, ease: 'back.out(2.2)' }, t);
  if (dur) tl.to(sel, { opacity: 0, scale: 0.85, duration: 0.16, ease: 'power2.in' }, t + dur);
};
Object.entries(CENAS).forEach(([k, [a, b]]) => { if (k !== 'intro') tl.set('#sc-' + k, { opacity: 1 }, a + 0.25); tl.set('#sc-' + k, { opacity: 0 }, b + 0.25); });
Object.values(CENAS).forEach(([a, b]) => tl.fromTo('#cam', { scale: 1, svgOrigin: '540 1150' }, { scale: 1.06, duration: b - a - 0.3, ease: 'sine.inOut' }, a + 0.25));
// intro
pop('#t-titulo', 0.2, 6.2, 540, 470);
pop('#t-5', 0.45, 3.2, 540, 660);
pop('#t-verdade', 3.85, 2.6, 540, 800);
// números entre as situações
const numeros = [['1', 6.8], ['2', 20.8], ['3', 32.1], ['4', 43.2], ['5', 52.6]];
numeros.forEach(([n, t]) => {
  const t0 = t - 0.55;
  tl.fromTo('#numero', { opacity: 0 }, { opacity: 1, duration: 0.12 }, t0);
  tl.fromTo('#num-txt', { scale: 0.3, svgOrigin: '540 900' }, { scale: 1, duration: 0.35, ease: 'back.out(2.5)' }, t0);
  tl.to('#numero', { opacity: 0, duration: 0.18 }, t + 0.42);
});
// títulos e selos
SITU.forEach(([id, , , selos]) => {
  const [a, b] = CENAS[id];
  pop('#tt-' + id, a + 0.6, b - a - 0.75, 540, 470);
  selos.forEach(([, , t], i) => { tl.fromTo(`#ts-${id}-${i}`, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.3, ease: 'back.out(1.8)' }, t); tl.to(`#ts-${id}-${i}`, { opacity: 0, duration: 0.15 }, b + 0.1); });
});
// engasgo: vítima treme; a cada compressão, o corpo dá um tranco
// incêndio: fumaça desce do teto, chamas tremem, "X" quando ele corre de pé, tosse
tl.fromTo('#fumaca-r', { attr: { height: 500 } }, { attr: { height: 1000 }, duration: 10, ease: 'none' }, 21.0);
tl.fromTo('.nuvem-f', { y: 0 }, { y: 360, duration: 10, ease: 'none', stagger: 0.1 }, 21.0);
tl.to('#fogo .chama', { scaleY: 1.15, transformOrigin: '50% 100%', duration: 0.18, yoyo: true, repeat: 61, ease: 'sine.inOut' }, 21.0);
pop('#xis', 24.3, 1.9, 560, 760);
tl.fromTo('#tosse', { opacity: 0 }, { opacity: 1, duration: 0.1, yoyo: true, repeat: 5 }, 24.6);
// choque: raios piscando até desligar o disjuntor
tl.set('#raios', { opacity: 1 }, 32.4);
tl.to('#raios', { opacity: 0.2, duration: 0.07, yoyo: true, repeat: 79, ease: 'none' }, 32.4);
tl.set('#raios', { opacity: 0 }, 38.2);
tl.to('#alavanca', { y: 60, duration: 0.15, ease: 'power2.in' }, 38.1);
pop('#xis', 34.6, 1.8, 560, 760);
// carro: carro aparece, afunda devagar (água sobe), balança
tl.set(['#cf', '#cfr', '#agua'], { opacity: 1 }, 52.85);
tl.set(['#cf', '#cfr'], { opacity: 0 }, 63.55); tl.set('#agua', { opacity: 0 }, 63.55);
tl.fromTo(['#cf', '#cfr'], { y: 0 }, { y: 120, duration: 7.4, ease: 'power1.in' }, 52.85);
tl.fromTo(['#agua-r', '#agua-o'], { y: 0 }, { y: -40, duration: 10, ease: 'none' }, 52.85);
tl.to(['#cf', '#cfr'], { rotation: 3, svgOrigin: `${CXc} ${CYc}`, duration: 0.8, yoyo: true, repeat: 8, ease: 'sine.inOut' }, 52.85);
// final
tl.to('#final', { opacity: 1, duration: 0.25 }, 63.3);
tl.fromTo('#fim-t', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: 'back.out(2)' }, 63.4);
tl.fromTo('#fim-n', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 64.6);
pop('#fim-c', 65.3, 0, 540, 1160);
tl.to('#fim-c', { scale: 1.05, svgOrigin: '540 1160', duration: 0.3, yoyo: true, repeat: 5, ease: 'sine.inOut' }, 65.8);
tl.set({}, {}, DUR);

// ---------- relógio externo (skill edit) ----------
const numTxt = $('#num-txt');
window.__timeline = tl;
window.__duration = DUR;
window.__seek = t => {
  tl.seek(t, false);
  atores.forEach(a => { const vivo = t >= a._de && t < a._ate; a._g.style.display = vivo ? '' : 'none'; if (vivo) a.desenhar(t); });
  const vivoCao = t >= cao._de && t < cao._ate; cao._g.style.display = vivoCao ? '' : 'none'; if (vivoCao) cao.desenhar(t);
  const n = numeros.filter(([, tn]) => t >= tn - 0.6).pop();
  numTxt.textContent = n ? n[0] : '1';
  leg.seek(t);
};
window.__seek(0);
</script></body></html>
